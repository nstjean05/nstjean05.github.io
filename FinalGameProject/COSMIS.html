<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>COSMIS — Cosmic Serpent Odyssey</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Exo 2', sans-serif; }

    #mainScene { position: fixed; inset: 0; width: 100vw; height: 100vh; }
    #starsCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    #levelBarContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 10px;
      background: rgba(255,255,255,0.08);
      z-index: 160;
      pointer-events: none;
    }
    #levelBar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4af, #0ff);
      transition: width 0.15s linear, background 0.2s linear;
    }

    #hud {
      position: fixed;
      top: 18px;
      left: 0;
      right: 0;
      z-index: 150;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0 20px;
    }
    .hud-panel {
      background: rgba(0,5,20,0.7);
      border: 1px solid rgba(100,180,255,0.3);
      border-radius: 8px;
      padding: 8px 16px;
      color: #7df;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      min-width: 110px;
    }
    .hud-panel .val { font-size: 22px; font-weight: 700; color: #aef; display: block; }
    #levelBadge { color: #fa0; }

    #boostContainer {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 150;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    #boostBar {
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    #boostBarInner {
      width: 160px;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(100,180,255,0.3);
      border-radius: 4px;
      overflow: hidden;
    }
    #boostBarFill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #4af, #0ff);
      border-radius: 4px;
      transition: background 0.2s;
    }
    #boostLabel { color: rgba(150,220,255,0.6); font-size: 10px; letter-spacing: 0.15em; font-family: 'Orbitron', sans-serif; }

    #boostToggleBtn {
      background: rgba(0, 5, 20, 0.8);
      border: 1px solid #4af;
      padding: 8px 16px;
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: #4af;
      cursor: pointer;
      border-radius: 4px;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    #boostToggleBtn.active {
      background: rgba(255, 68, 0, 0.3);
      border-color: #ff4400;
      color: #fff;
      box-shadow: 0 0 10px rgba(255, 68, 0, 0.4);
    }

    #minimap {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 130px;
      height: 130px;
      background: rgba(0,5,20,0.75);
      border: 1px solid rgba(100,180,255,0.3);
      border-radius: 50%;
      z-index: 150;
      overflow: hidden;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      color: #fff;
    }
    .screen.hidden { display: none; }

    #flashScreen { background: radial-gradient(ellipse at center, #000820 0%, #000 100%); }
    #flashScreen h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 900;
      color: #fff;
      letter-spacing: 0.15em;
      text-shadow: 0 0 40px #4af, 0 0 80px #07f;
      animation: pulse 2s ease-in-out infinite;
    }
    #flashScreen .subtitle {
      font-family: 'Exo 2', sans-serif;
      font-size: 1.1rem;
      color: #7df;
      letter-spacing: 0.3em;
      margin-top: 8px;
      text-transform: uppercase;
      text-align: center;
    }
    #flashScreen .credit {
      margin-top: 40px;
      color: rgba(150,200,255,0.6);
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      text-align: center;
      line-height: 1.6;
    }
    #flashScreen .credit strong { color: #aef; }
    #flashScreen .enter {
      margin-top: 50px;
      color: rgba(150,200,255,0.5);
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      animation: blink 1.5s step-end infinite;
    }

    #setupScreen, #manualScreen { background: rgba(0,5,20,0.95); backdrop-filter: blur(10px); }
    .btn {
      background: linear-gradient(135deg, #0af, #07f);
      border: none;
      padding: 14px 48px;
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 6px;
      color: #000;
      margin-top: 32px;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    @keyframes pulse {
      0%,100% { text-shadow: 0 0 40px #4af, 0 0 80px #07f; }
      50% { text-shadow: 0 0 60px #8cf, 0 0 120px #4af, 0 0 180px #07f; }
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    #deathScreen { background: rgba(20,0,0,0.85); backdrop-filter: blur(8px); }
    #levelClearScreen { background: rgba(0,10,30,0.85); backdrop-filter: blur(8px); }
    .stats { margin: 20px 0; text-align: center; color: #7df; font-size: 1.1rem; line-height: 2; }
    .stats span { color: #aef; font-weight: 600; }
  </style>
</head>
<body>

<canvas id="starsCanvas"></canvas>
<div id="levelBarContainer"><div id="levelBar"></div></div>

<div class="screen" id="flashScreen">
  <h1>COSMIS</h1>
  <div class="subtitle">A Cosmic Serpent Odyssey</div>
  <div class="credit">
    Developed by <strong>Noah St. Jean</strong><br>
    CMPT 461: Immersive Computing · Trinity Western University · 2026
  </div>
  <div class="enter">CLICK ANYWHERE TO CONTINUE</div>
</div>

<div class="screen hidden" id="menuScreen">
  <h1>COSMIS</h1>
  <p>Grow. Devour. Dominate the cosmos.</p>
  <div style="display:flex; gap:16px; margin-top:20px;">
    <button class="btn" id="playBtn">ENTER NEBULA</button>
  </div>
</div>

<div id="hud">
  <div class="hud-panel">Mass<span class="val" id="scoreVal">0</span></div>
  <div class="hud-panel" id="levelBadge">Level<span class="val" id="levelVal">1</span></div>
  <div class="hud-panel">Kills<span class="val" id="killsVal">0</span></div>
</div>

<div id="minimap"><canvas id="mmCanvas" width="130" height="130"></canvas></div>

<div id="boostContainer">
  <button id="boostToggleBtn">Boost Off</button>
  <div id="boostBar">
    <div id="boostBarInner"><div id="boostBarFill"></div></div>
    <div id="boostLabel">BOOST</div>
  </div>
</div>

<div class="screen hidden" id="deathScreen">
  <h1>OBLITERATED</h1>
  <div class="stats">
    Final Mass: <span id="finalScore">0</span><br>
    Rivals Defeated: <span id="finalKills">0</span>
  </div>
  <button class="btn" id="rejoinBtn">TRY AGAIN</button>
</div>

<a-scene id="mainScene" renderer="antialias:true;colorManagement:true" vr-mode-ui="enabled:true">
  <a-assets id="assets" timeout="10000">
    <img id="texEarth"   src="https://raw.githubusercontent.com/aframevr/sample-assets/master/assets/images/space/earth_atmos_2048.jpg" crossorigin="anonymous">
    <img id="texMars"    src="https://raw.githubusercontent.com/aframevr/sample-assets/master/assets/images/space/mars_1k_color.jpg" crossorigin="anonymous">
    <img id="texJupiter" src="https://raw.githubusercontent.com/aframevr/sample-assets/master/assets/images/space/jupiter_1k.jpg" crossorigin="anonymous">
    <img id="texMoon"    src="https://raw.githubusercontent.com/aframevr/sample-assets/master/assets/images/space/moon_1k.jpg" crossorigin="anonymous">
    <img id="texSun"     src="https://raw.githubusercontent.com/aframevr/sample-assets/master/assets/images/space/sun_1k_color.jpg" crossorigin="anonymous">
    <img id="texNebula"  src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/sechelt.jpg" crossorigin="anonymous">
    <img id="texRock"    src="https://cdn.aframe.io/a-painter/images/floor.jpg" crossorigin="anonymous">
  </a-assets>

  <a-entity light="type:ambient;color:#ffffff;intensity:0.5"></a-entity>
  <a-entity light="type:directional;color:#ffffff;intensity:0.8" position="10 20 10"></a-entity>
  <a-entity id="playerLight" light="type:point;color:#4af;intensity:5;distance:50"></a-entity>

  <a-sky id="skyBox" src="#texNebula" rotation="0 0 0" color="#111"></a-sky>

  <a-entity id="floorContainer"></a-entity>
  <a-entity id="orbContainer"></a-entity>
  <a-entity id="snakeContainer"></a-entity>
  <a-entity id="obstacleContainer"></a-entity>

  <a-entity id="cameraRig" position="0 45 0">
    <a-entity id="cameraPivot" rotation="-90 0 0">
      <a-camera id="cam" look-controls="enabled:true" wasd-controls="enabled:false">
        <a-cursor fuse="false" color="#4af"></a-cursor>
      </a-camera>
    </a-entity>
  </a-entity>
</a-scene>

<script>
const BORDER_RADIUS = 200;
const BASE_RADIUS = 0.6;
const PLANET_TEXTURES = ['#texEarth', '#texMars', '#texJupiter', '#texMoon', '#texSun'];
const NPC_COLORS = ['#ff6644','#4488ff','#ffdd22','#ff44cc','#ff9922'];

let running = false;
let currentLevel = 1;
let player = null;
let npcs = [];
let orbs = [];
let asteroids = [];
let keys = { a: false, d: false, boost: false };
let playerAngle = 0;
let totalKills = 0;
let boostFuel = 100;
let npcSpawnCounter = 0;
let settings = { boostToggled: false };

// ── Stars Background ──
(function initStars() {
  const canvas = document.getElementById('starsCanvas');
  const ctx = canvas.getContext('2d');
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize); resize();
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    for(let i=0; i<100; i++) {
      ctx.beginPath();
      ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, 1, 0, Math.PI*2);
      ctx.fill();
    }
  }
  draw();
})();

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  if (id) document.getElementById(id).classList.remove('hidden');
}

// ── Snake Construction (Fixed Textures) ──
function createSegmentEl(texture, color, radius) {
  const s = document.createElement('a-sphere');
  s.setAttribute('radius', radius);
  // FIX: Using color:#ffffff ensures the texture isn't tinted dark/colored.
  // emissiveIntensity is kept low so it doesn't wash out the planet details.
  s.setAttribute('material', `src:${texture}; color:#ffffff; emissive:${color}; emissiveIntensity:0.15; roughness:0.8; metalness:0.2`);
  return s;
}

function createSnake(isPlayer, startX, startZ) {
  const container = document.getElementById('snakeContainer');
  const color = isPlayer ? '#44bbff' : NPC_COLORS[npcSpawnCounter % NPC_COLORS.length];
  const texture = isPlayer ? PLANET_TEXTURES[0] : PLANET_TEXTURES[(npcSpawnCounter % 4) + 1];
  npcSpawnCounter++;

  const snake = {
    segments: [], score: 8, color, texture,
    angle: Math.random() * Math.PI * 2,
    isPlayer, dead: false, currentRadius: BASE_RADIUS
  };

  for (let i = 0; i < 8; i++) {
    const s = createSegmentEl(texture, color, BASE_RADIUS);
    container.appendChild(s);
    const seg = { el: s, x: startX - i * BASE_RADIUS, z: startZ };
    if (s.object3D) s.object3D.position.set(seg.x, BASE_RADIUS, seg.z);
    snake.segments.push(seg);
  }
  return snake;
}

function initArena() {
  const floor = document.getElementById('floorContainer');
  floor.innerHTML = '';
  const disc = document.createElement('a-circle');
  disc.setAttribute('rotation', '-90 0 0');
  disc.setAttribute('radius', BORDER_RADIUS);
  disc.setAttribute('material', 'src:#texRock; repeat:10 10; opacity:0.2');
  floor.appendChild(disc);
}

function startGame() {
  const sContainer = document.getElementById('snakeContainer');
  while(sContainer.firstChild) sContainer.removeChild(sContainer.firstChild);
  
  initArena();
  player = createSnake(true, 0, 0);
  playerAngle = 0;
  running = true;
  showScreen(null);
  requestAnimationFrame(gameLoop);
}

function updateSnakeSegments(snake) {
  const segDist = snake.currentRadius;
  const segs = snake.segments;
  for (let i = segs.length - 1; i > 0; i--) {
    const seg = segs[i], prev = segs[i - 1];
    const dx = prev.x - seg.x, dz = prev.z - seg.z;
    const d = Math.sqrt(dx * dx + dz * dz);
    if (d > segDist) {
      const m = (d - segDist) / d;
      seg.x += dx * m; seg.z += dz * m;
    }
    if (seg.el.object3D) seg.el.object3D.position.set(seg.x, snake.currentRadius, seg.z);
  }
  const head = segs[0];
  if (head.el.object3D) head.el.object3D.position.set(head.x, snake.currentRadius, head.z);
}

function gameLoop() {
  if (!running) return;

  if (player && !player.dead) {
    const speed = (keys.boost || settings.boostToggled) && boostFuel > 0 ? 0.5 : 0.25;
    if ((keys.boost || settings.boostToggled) && boostFuel > 0) boostFuel -= 0.5;
    else if (boostFuel < 100) boostFuel += 0.2;

    const head = player.segments[0];
    head.x += Math.cos(playerAngle) * speed;
    head.z += Math.sin(playerAngle) * speed;
    updateSnakeSegments(player);

    const rig = document.getElementById('cameraRig');
    rig.object3D.position.set(head.x, 45, head.z);
    
    document.getElementById('boostBarFill').style.width = boostFuel + '%';
    document.getElementById('scoreVal').textContent = player.score;

    if (Math.hypot(head.x, head.z) > BORDER_RADIUS) {
      running = false;
      showScreen('deathScreen');
    }
  }

  requestAnimationFrame(gameLoop);
}

// ── UI Events ──
document.getElementById('flashScreen').addEventListener('click', () => showScreen('menuScreen'));
document.getElementById('playBtn').addEventListener('click', startGame);
document.getElementById('rejoinBtn').addEventListener('click', startGame);

const boostToggleBtn = document.getElementById('boostToggleBtn');
boostToggleBtn.addEventListener('click', () => {
  settings.boostToggled = !settings.boostToggled;
  boostToggleBtn.classList.toggle('active', settings.boostToggled);
  boostToggleBtn.textContent = settings.boostToggled ? "Boost On" : "Boost Off";
});

document.addEventListener('keydown', e => {
  if (e.code === 'KeyA') playerAngle -= 0.1;
  if (e.code === 'KeyD') playerAngle += 0.1;
  if (e.code === 'Space') keys.boost = true;
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space') keys.boost = false;
});
</script>
</body>
</html>
